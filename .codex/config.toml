[agents]
enabled = true
max_concurrent_threads_per_session = 4

[agents.explorer]
description = "Read-only repository explorer. Map execution paths, contracts, risks, and relevant checks."
config_file = "./agents/explorer.toml"

[agents.docs_researcher]
description = "Research primary technical sources and report claims, uncertainty, and decision impact."
config_file = "./agents/docs_researcher.toml"

[agents.planner]
description = "Create a bounded SDD plan, acceptance criteria, risks, and verification approach."
config_file = "./agents/planner.toml"

[agents.test_designer]
description = "Independently derive BDD scenarios and test oracles."
config_file = "./agents/test_designer.toml"

[agents.implementer]
description = "Single writer implementing the accepted scope and reporting exact checks."
config_file = "./agents/implementer.toml"

[agents.reviewer]
description = "Read-only independent code reviewer focused on falsifiable defects."
config_file = "./agents/reviewer.toml"

[agents.verifier]
description = "Read-only acceptance verifier at observable behavior boundaries."
config_file = "./agents/verifier.toml"

[agents.security_reviewer]
description = "Read-only security reviewer for trust boundaries and external effects."
config_file = "./agents/security_reviewer.toml"

[agents.gameplay_specialist]
description = "Read-only Factory Wars domain specialist for match rules, empire progression, bots, and gameplay invariants."
config_file = "./agents/gameplay_specialist.toml"

[agents.web_game_ui_specialist]
description = "Read-only specialist for the browser game UI, arena HUD, input, canvas, responsive layout, and script integration."
config_file = "./agents/web_game_ui_specialist.toml"

[agents.supabase_specialist]
description = "Read-only specialist for Supabase schemas, migrations, RPC, auth, persistence, and synchronization."
config_file = "./agents/supabase_specialist.toml"

[agents.balance_specialist]
description = "Read-only specialist for game balance, seeded bot simulations, analytics, and reproducible tuning evidence."
config_file = "./agents/balance_specialist.toml"
