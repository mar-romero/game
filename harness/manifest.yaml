name: factory-wars-engineering-harness
version: 2
source_of_truth:
  instructions: AGENTS.md
  policy: AI_POLICY.md
  roles: .agents/roles
  skills: .agents/skills
  model_routing: harness/model-routing.json
  orchestrator: scripts/harness_orchestrator.py
  codex_agents: .codex/agents
  codex_hooks: .codex/hooks.json
workflow:
  - REQUEST
  - EXPLORE
  - DOMAIN_SPECIALISTS_IF_ROUTED
  - RDD_IF_NEEDED
  - SDD
  - BDD_TDD_MODE
  - IMPLEMENT
  - CHECKS
  - REVIEW
  - VERIFY
  - CLOSE
rdd:
  default: off
  trigger: material uncertainty in product, domain, architecture, or external contracts
sdd:
  required: before non-trivial implementation
  output: outcome, scope, acceptance criteria, risks, and verification plan
tdd_modes:
  - tdd_required
  - characterization_then_tdd
  - spike_then_tdd
  - tdd_preferred
  - test_after_allowed
  - not_applicable
delegation:
  default: conditional_by_risk_route
  writer_count_per_file_set: 1
  risk_routes:
    R0: []
    R1: [explorer, implementer, reviewer]
    R2: [explorer, planner, test_designer, implementer, reviewer, verifier]
    R3: [explorer, planner, test_designer, implementer, reviewer, verifier, security_reviewer]
  conditional_roles:
    RDD: [docs_researcher]
    security_signal: [security_reviewer]
    game_domain_signal: [gameplay_specialist]
    browser_ui_signal: [web_game_ui_specialist]
    persistence_signal: [supabase_specialist]
    balance_signal: [balance_specialist]
risk:
  R0: diff review
  R1: relevant checks and independent review when available
  R2: explicit criteria, checks, review, and verification
  R3: security review and human approval before external effects
excluded:
  - worktrees
  - task registry
  - sprint planning
  - provider-specific agent generation
  - mandatory formal planning artifacts for routine changes
